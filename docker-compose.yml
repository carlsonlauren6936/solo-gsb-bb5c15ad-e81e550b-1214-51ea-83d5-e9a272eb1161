services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LEDGER_DB_PATH: /data/ledger.db
      # /leaderboard/page 游标的 HMAC 签名密钥，生产环境务必覆盖为强随机值
      LEADERBOARD_CURSOR_SECRET: ${LEADERBOARD_CURSOR_SECRET:-dev-only-insecure-cursor-secret}
    volumes:
      - ledger-data:/data
    restart: unless-stopped

volumes:
  ledger-data:
